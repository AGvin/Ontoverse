<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Closed Time Loop Without Branching</title>
  <desc id="desc">A single realized timeline crosses an unbounded ruby frontal time plane. A dashed oval past-directed transit leaves the future departure node, crosses the same plane, and reintegrates into the past without creating a branch. The interval between reintegration and departure is shown thicker to represent temporary parameter enrichment.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="82%">
      <stop offset="0" stop-color="#07152a"/>
      <stop offset="0.65" stop-color="#020713"/>
      <stop offset="1" stop-color="#00030a"/>
    </radialGradient>
    <linearGradient id="timeline" x1="150" y1="410" x2="1450" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14eaff"/>
      <stop offset="0.50" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#ff5ee7"/>
    </linearGradient>
    <linearGradient id="loop" x1="1140" y1="610" x2="460" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5ee7"/>
      <stop offset="0.50" stop-color="#a78bff"/>
      <stop offset="1" stop-color="#14eaff"/>
    </linearGradient>
    <linearGradient id="planeFill" x1="770" y1="0" x2="850" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6076" stop-opacity="0.08"/>
      <stop offset="0.50" stop-color="#ff244b" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ff6076" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text id="label-title" x="800" y="70" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="50" text-anchor="middle">Closed Time Loop Without Branching</text>

  <rect x="405" y="100" width="790" height="92" rx="14" fill="#050a16" stroke="#264c7a"/>
  <text id="label-relation-1a" x="475" y="138" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="22">past-directed travel</text>
  <text x="704" y="138" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="22">~</text>
  <text id="label-relation-1b" x="748" y="138" fill="#8eb9ff" font-family="Segoe UI, Arial, sans-serif" font-size="22">closed causal loop</text>
  <text x="968" y="138" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="22">/</text>
  <text id="label-relation-1c" x="1005" y="138" fill="#ff526b" font-family="Segoe UI, Arial, sans-serif" font-size="22">no branching</text>
  <line x1="445" y1="151" x2="1155" y2="151" stroke="#34425d"/>
  <text id="label-relation-2a" x="493" y="178" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="22">observed future</text>
  <text x="704" y="178" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="22">~</text>
  <text id="label-relation-2b" x="748" y="178" fill="#b9a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="22">already includes the past intervention</text>

  <g opacity="0.10" stroke="#1a63bd" fill="none">
    <line x1="120" y1="410" x2="1480" y2="410"/>
    <line x1="300" y1="260" x2="300" y2="720"/>
    <line x1="560" y1="260" x2="560" y2="720"/>
    <line x1="1040" y1="260" x2="1040" y2="720"/>
    <line x1="1300" y1="260" x2="1300" y2="720"/>
  </g>

  <text id="label-past" x="95" y="421" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="38">Past</text>
  <text id="label-future" x="1485" y="421" fill="#ff5ee7" font-family="Segoe UI, Arial, sans-serif" font-size="38">Future</text>

  <!-- Primary realized history. The enriched interval is deliberately thicker. -->
  <line x1="145" y1="410" x2="460" y2="410" stroke="#14eaff" stroke-width="4" stroke-linecap="round"/>
  <line x1="460" y1="410" x2="1140" y2="410" stroke="url(#timeline)" stroke-width="12" stroke-linecap="round" filter="url(#softGlow)"/>
  <line x1="1140" y1="410" x2="1455" y2="410" stroke="#ff5ee7" stroke-width="4" stroke-linecap="round"/>
  <path d="M1455 410 l-19 -11 M1455 410 l-19 11" fill="none" stroke="#ff5ee7" stroke-width="4" stroke-linecap="round"/>

  <!-- Past-directed transit: a smooth oval-like loop with crisp tangent attachments. -->
  <path d="M1140 410 C1205 410 1260 450 1260 520 C1260 650 1080 716 800 716 C520 716 340 650 340 520 C340 450 395 410 460 410" fill="none" stroke="url(#loop)" stroke-width="6" stroke-dasharray="15 13" stroke-linecap="butt" filter="url(#softGlow)"/>

  <!-- Unbounded frontal-time plane: intentionally clipped by the SVG viewport. -->
  <polygon points="770,-70 850,-115 850,1015 770,1060" fill="url(#planeFill)"/>
  <line x1="770" y1="-70" x2="770" y2="1060" stroke="#ff4562" stroke-width="4"/>
  <line x1="850" y1="-115" x2="850" y2="1015" stroke="#ff6b7d" stroke-width="4"/>

  <!-- Redraw trajectory sections inside the translucent plane to emphasize intersection, not avoidance. -->
  <line x1="770" y1="410" x2="850" y2="410" stroke="#f8fbff" stroke-width="12" stroke-linecap="round" opacity="0.92"/>
  <path d="M770 716 C796 716 824 716 850 716" fill="none" stroke="#c69aff" stroke-width="6" stroke-dasharray="15 13" stroke-linecap="butt" opacity="0.95"/>

  <text id="label-frontal-plane" x="875" y="760" fill="#ff5d73" font-family="Segoe UI, Arial, sans-serif" font-size="25">frontal time plane</text>
  <text id="label-unbounded-plane" x="875" y="792" fill="#aab6d8" font-family="Segoe UI, Arial, sans-serif" font-size="18">conceptually unbounded; viewport shows only a slice</text>
  <line x1="862" y1="748" x2="832" y2="710" stroke="#ff5d73" stroke-width="2"/>

  <!-- Reintegration node and label. -->
  <circle cx="460" cy="410" r="18" fill="#07152a" stroke="#f8fbff" stroke-width="4" filter="url(#softGlow)"/>
  <circle cx="460" cy="410" r="10" fill="#07152a" stroke="#14eaff" stroke-width="4"/>
  <text id="label-reintegration-1" x="330" y="285" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="24">reintegration into</text>
  <text id="label-reintegration-2" x="351" y="318" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="24">past history</text>
  <path d="M385 330 H460 V382" fill="none" stroke="#14eaff" stroke-width="2"/>

  <!-- Departure node and direct no-branch annotation. -->
  <circle cx="1140" cy="410" r="18" fill="#07152a" stroke="#f8fbff" stroke-width="4" filter="url(#softGlow)"/>
  <circle cx="1140" cy="410" r="10" fill="#07152a" stroke="#ff5ee7" stroke-width="4"/>
  <text id="label-departure-1" x="1095" y="283" fill="#ff5ee7" font-family="Segoe UI, Arial, sans-serif" font-size="24">departure</text>
  <text id="label-departure-2" x="1081" y="316" fill="#ff5ee7" font-family="Segoe UI, Arial, sans-serif" font-size="24">from future</text>
  <path d="M1140 328 V382" fill="none" stroke="#ff5ee7" stroke-width="2"/>

  <rect x="1220" y="245" width="330" height="94" rx="14" fill="#090a18" stroke="#ff5ee7" stroke-width="2"/>
  <text id="label-no-branch-1" x="1250" y="285" fill="#ff79e8" font-family="Segoe UI, Arial, sans-serif" font-size="22">same primary timeline</text>
  <text id="label-no-branch-2" x="1250" y="318" fill="#ff79e8" font-family="Segoe UI, Arial, sans-serif" font-size="22">no branch created</text>
  <path d="M1350 339 C1310 360 1235 378 1160 400" fill="none" stroke="#ff5ee7" stroke-width="2"/>

  <!-- Enriched interval label. -->
  <text id="label-enriched-1" x="800" y="280" fill="#b9c5ff" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle">temporarily parameter-enriched interval</text>
  <line x1="800" y1="294" x2="800" y2="387" stroke="#b9c5ff" stroke-width="2"/>
  <circle cx="800" cy="387" r="4" fill="#b9c5ff"/>

  <!-- Transit isolation label. -->
  <text id="label-isolated-transit" x="800" y="660" fill="#a78bff" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle">isolated past-directed transit</text>

  <rect x="255" y="785" width="1090" height="84" rx="14" fill="#050a16" stroke="#29354f"/>
  <text id="label-note-1" x="800" y="818" fill="#dfe8ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle">Past-directed travel is already part of the realized causal history; it does not rewrite that history into another branch.</text>
  <text id="label-note-2" x="800" y="849" fill="#aab6d8" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle">After reintegration, the interval carries additional state parameters until the original departure closes the compensation loop.</text>
</svg>
