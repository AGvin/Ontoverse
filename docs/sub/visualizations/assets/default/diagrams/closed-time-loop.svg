<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Closed Time Loop Without Branching</title>
  <desc id="desc">A single realized timeline crosses a ruby frontal-time plane. A dashed oval transit leaves a future departure node, crosses the same plane, and reintegrates into the past without creating a branch. The interval between reintegration and departure is shown as an enriched luminous sheath on the same primary timeline.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="47%" r="86%">
      <stop offset="0" stop-color="#07152a"/>
      <stop offset="0.68" stop-color="#020713"/>
      <stop offset="1" stop-color="#00030a"/>
    </radialGradient>
    <linearGradient id="history" x1="150" y1="402" x2="1450" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14eaff"/>
      <stop offset="0.50" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#ff5ee7"/>
    </linearGradient>
    <linearGradient id="enrichment" x1="360" y1="402" x2="1240" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28dfff" stop-opacity="0.34"/>
      <stop offset="0.50" stop-color="#f8fbff" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#ff62e5" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="loop" x1="1260" y1="510" x2="330" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff63e6"/>
      <stop offset="0.50" stop-color="#a88cff"/>
      <stop offset="1" stop-color="#18e4ff"/>
    </linearGradient>
    <linearGradient id="plane" x1="790" y1="220" x2="858" y2="706" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff697c" stop-opacity="0.08"/>
      <stop offset="0.48" stop-color="#b31235" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff697c" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="nodeGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#16426f" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="800" y="70" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="48" text-anchor="middle">Closed Time Loop Without Branching</text>

  <!-- Localization-friendly relation box with generous padding and centered items. -->
  <rect x="350" y="102" width="900" height="94" rx="14" fill="#050a16" fill-opacity="0.94" stroke="#264c7a"/>
  <text x="550" y="141" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle">past-directed travel</text>
  <text x="682" y="141" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle">~</text>
  <text x="846" y="141" fill="#c7c6f8" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle">closed causal loop</text>
  <text x="963" y="141" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle">/</text>
  <text x="1088" y="141" fill="#ff526b" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle">no branching</text>
  <line x1="395" y1="154" x2="1205" y2="154" stroke="#34425d"/>
  <text x="560" y="179" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle">observed future</text>
  <text x="682" y="179" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle">~</text>
  <text x="940" y="179" fill="#b9a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle">already contains the past intervention</text>

  <!-- Main realized history. -->
  <text x="60" y="414" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="36">Past</text>
  <text x="1482" y="414" fill="#ff5ee7" font-family="Segoe UI, Arial, sans-serif" font-size="36">Future</text>
  <path d="M120 402H1450" fill="none" stroke="url(#history)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M1450 402l-18-11M1450 402l-18 11" fill="none" stroke="#ff5ee7" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Enriched interval is a luminous sheath around the same line. -->
  <path d="M360 402H1240" fill="none" stroke="url(#enrichment)" stroke-width="16" stroke-linecap="round" filter="url(#lineGlow)"/>
  <path d="M360 402H1240" fill="none" stroke="url(#history)" stroke-width="5.8" stroke-linecap="round"/>

  <!-- Past-directed transit: broad oval with crisp tangent attachments and no arrow. -->
  <path d="M1240 402L1292 402C1360 412 1404 451 1408 497C1418 611 1150 650 806 650C462 650 205 616 220 500C226 451 266 418 316 406L360 402"
        fill="none" stroke="url(#loop)" stroke-width="10" stroke-opacity="0.10" filter="url(#lineGlow)"/>
  <path d="M1240 402L1292 402C1360 412 1404 451 1408 497C1418 611 1150 650 806 650C462 650 205 616 220 500C226 451 266 418 316 406L360 402"
        fill="none" stroke="url(#loop)" stroke-width="5" stroke-dasharray="13 12" stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- Frontal time plane: projected ruby rectangle crossing both trajectories. -->
  <polygon points="790,246 858,207 858,707 790,668" fill="url(#plane)" stroke="#ff526b" stroke-width="2.6"/>
  <line x1="858" y1="207" x2="858" y2="707" stroke="#ff687b" stroke-width="4.2"/>

  <!-- Key nodes only. -->
  <g filter="url(#nodeGlow)">
    <circle cx="360" cy="402" r="18" fill="#07152a" stroke="#f8fbff" stroke-width="3.6"/>
    <circle cx="360" cy="402" r="10" fill="#07152a" stroke="#14eaff" stroke-width="3.6"/>
    <circle cx="1240" cy="402" r="18" fill="#07152a" stroke="#f8fbff" stroke-width="3.6"/>
    <circle cx="1240" cy="402" r="10" fill="#07152a" stroke="#ff5ee7" stroke-width="3.6"/>
  </g>

  <!-- Reintegration callout. -->
  <text x="360" y="264" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle">reintegration into</text>
  <text x="360" y="296" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle">past history</text>
  <path d="M360 312V367" fill="none" stroke="#14eaff" stroke-width="1.8"/>
  <circle cx="360" cy="367" r="4" fill="#14eaff"/>

  <!-- Parameter-enriched interval bracket spans exactly between key nodes. -->
  <text x="800" y="288" fill="#c1c3f2" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle">parameter-enriched interval</text>
  <path d="M360 308H1240M360 308V326M1240 308V326" fill="none" stroke="#a6b1ce" stroke-width="1.5"/>

  <!-- Departure and no-branch callout. -->
  <text x="1240" y="264" fill="#ff5ee7" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle">departure</text>
  <text x="1240" y="296" fill="#ff5ee7" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle">from future</text>
  <path d="M1240 312V367" fill="none" stroke="#ff5ee7" stroke-width="1.8"/>
  <circle cx="1240" cy="367" r="4" fill="#ff5ee7"/>

  <rect x="1320" y="220" width="250" height="84" rx="13" fill="#090a18" fill-opacity="0.96" stroke="#ff5ee7" stroke-width="1.8"/>
  <circle cx="1352" cy="262" r="13" fill="#07152a" stroke="#c68cff" stroke-width="1.8"/>
  <circle cx="1352" cy="262" r="3.5" fill="#ff5ee7"/>
  <text x="1383" y="256" fill="#ff79e8" font-family="Segoe UI, Arial, sans-serif" font-size="17">same primary timeline</text>
  <text x="1383" y="282" fill="#ff79e8" font-family="Segoe UI, Arial, sans-serif" font-size="17">no branch created</text>
  <path d="M1442 305C1384 334 1318 365 1261 394" fill="none" stroke="#ff5ee7" stroke-width="1.7"/>

  <!-- Transit and frontal-time labels. -->
  <circle cx="800" cy="651" r="4" fill="#a78bff"/>
  <path d="M800 647V623" fill="none" stroke="#a78bff" stroke-width="1.6"/>
  <text x="800" y="622" fill="#a78bff" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle">isolated past-directed transit</text>

  <circle cx="880" cy="708" r="4" fill="#ff5d73"/>
  <path d="M884 708H912" fill="none" stroke="#ff5d73" stroke-width="1.6"/>
  <text x="924" y="715" fill="#ff5d73" font-family="Segoe UI, Arial, sans-serif" font-size="21">frontal time plane</text>

  <!-- Localization-friendly explanatory panel with shorter lines and extra width. -->
  <rect x="160" y="754" width="1280" height="112" rx="15" fill="#050a16" fill-opacity="0.96" stroke="#29354f"/>
  <g transform="translate(242 810)">
    <circle cx="0" cy="0" r="29" fill="none" stroke="#526885" stroke-width="1.8"/>
    <path d="M-23 4A24 24 0 0 1 15-19" fill="none" stroke="#14eaff" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M15-19l1 9 8-3" fill="none" stroke="#ff5ee7" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0-12V2L10 8" fill="none" stroke="#d7b0ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-24" cy="4" r="4.5" fill="#14eaff"/>
    <circle cx="23" cy="7" r="4.5" fill="#ff5ee7"/>
  </g>
  <line x1="302" y1="774" x2="302" y2="844" stroke="#34425d"/>
  <text x="334" y="792" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="17">The trip does not rewrite the timeline: its past intervention is already one of the causes of the future departure.</text>
  <text x="334" y="823" fill="#dfe8ff" font-family="Segoe UI, Arial, sans-serif" font-size="17">The traveler remains isolated during transit; reintegration expands the realized state or quantum-parameter set</text>
  <text x="334" y="849" fill="#dfe8ff" font-family="Segoe UI, Arial, sans-serif" font-size="17">until the original departure compensates and closes the loop.</text>
</svg>
