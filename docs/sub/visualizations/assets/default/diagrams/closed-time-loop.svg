<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Closed Time Loop Without Branching</title>
  <desc id="desc">A single realized timeline crosses a ruby frontal-time plane. A dashed oval transit leaves a future departure node, crosses the same plane, and reintegrates into the past without creating a branch. The interval between reintegration and departure is shown as an enriched luminous sheath on the same primary timeline.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="47%" r="86%">
      <stop offset="0" stop-color="#07152a"/>
      <stop offset="0.68" stop-color="#020713"/>
      <stop offset="1" stop-color="#00030a"/>
    </radialGradient>
    <linearGradient id="history" x1="150" y1="402" x2="1450" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14eaff"/>
      <stop offset="0.50" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#ff5ee7"/>
    </linearGradient>
    <linearGradient id="enrichment" x1="360" y1="402" x2="1240" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28dfff" stop-opacity="0.34"/>
      <stop offset="0.50" stop-color="#f8fbff" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#ff62e5" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="loop" x1="1260" y1="510" x2="330" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff63e6"/>
      <stop offset="0.50" stop-color="#a88cff"/>
      <stop offset="1" stop-color="#18e4ff"/>
    </linearGradient>
    <linearGradient id="plane" x1="790" y1="220" x2="858" y2="706" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff697c" stop-opacity="0.08"/>
      <stop offset="0.48" stop-color="#b31235" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff697c" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="nodeGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#16426f" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="800" y="70" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="48" text-anchor="middle">Closed Time Loop Without Branching</text>

  <!-- Compact relation box. -->
  <rect x="420" y="103" width="760" height="86" rx="14" fill="#050a16" fill-opacity="0.94" stroke="#264c7a"/>
  <text x="486" y="140" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="21">past-directed travel</text>
  <text x="706" y="140" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="21">~</text>
  <text x="748" y="140" fill="#c7c6f8" font-family="Segoe UI, Arial, sans-serif" font-size="21">closed causal loop</text>
  <text x="966" y="140" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="21">/</text>
  <text x="1008" y="140" fill="#ff526b" font-family="Segoe UI, Arial, sans-serif" font-size="21">no branching</text>
  <line x1="455" y1="153" x2="1145" y2="153" stroke="#34425d"/>
  <text x="505" y="178" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="21">observed future</text>
  <text x="706" y="178" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="21">~</text>
  <text x="748" y="178" fill="#b9a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="21">already contains the past intervention</text>

  <!-- Main realized history. -->
  <text x="72" y="414" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="36">Past</text>
  <text x="1480" y="414" fill="#ff5ee7" font-family="Segoe UI, Arial, sans-serif" font-size="36">Future</text>
  <path d="M148 402H1450" fill="none" stroke="url(#history)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M1450 402l-18-11M1450 402l-18 11" fill="none" stroke="#ff5ee7" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Enriched interval is a luminous sheath around the same line. -->
  <path d="M360 402H1240" fill="none" stroke="url(#enrichment)" stroke-width="14" stroke-linecap="round" filter="url(#lineGlow)"/>
  <path d="M360 402H1240" fill="none" stroke="url(#history)" stroke-width="5.8" stroke-linecap="round"/>

  <!-- Past-directed transit: broad oval with crisp tangent attachments and no arrow. -->
  <path d="M1240 402L1292 402C1360 412 1404 451 1408 497C1418 611 1150 650 806 650C462 650 205 616 220 500C226 451 266 418 316 406L360 402"
        fill="none" stroke="url(#loop)" stroke-width="10" stroke-opacity="0.10" filter="url(#lineGlow)"/>
  <path d="M1240 402L1292 402C1360 412 1404 451 1408 497C1418 611 1150 650 806 650C462 650 205 616 220 500C226 451 266 418 316 406L360 402"
        fill="none" stroke="url(#loop)" stroke-width="4.8" stroke-dasharray="13 12" stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- Frontal time plane: projected ruby rectangle crossing both trajectories. -->
  <polygon points="790,246 858,207 858,707 790,668" fill="url(#plane)" stroke="#ff526b" stroke-width="2.6"/>
  <line x1="858" y1="207" x2="858" y2="707" stroke="#ff687b" stroke-width="4.2"/>

  <!-- Key nodes only. -->
  <g filter="url(#nodeGlow)">
    <circle cx="360" cy="402" r="18" fill="#07152a" stroke="#f8fbff" stroke-width="3.6"/>
    <circle cx="360" cy="402" r="10" fill="#07152a" stroke="#14eaff" stroke-width="3.6"/>
    <circle cx="1240" cy="402" r="18" fill="#07152a" stroke="#f8fbff" stroke-width="3.6"/>
    <circle cx="1240" cy="402" r="10" fill="#07152a" stroke="#ff5ee7" stroke-width="3.6"/>
  </g>

  <!-- Reintegration callout. -->
  <text x="278" y="269" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="22">reintegration into</text>
  <text x="304" y="300" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="22">past history</text>
  <path d="M360 316V367" fill="none" stroke="#14eaff" stroke-width="1.8"/>
  <circle cx="360" cy="367" r="4" fill="#14eaff"/>

  <!-- Parameter-enriched interval bracket. -->
  <text x="800" y="292" fill="#c1c3f2" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle">parameter-enriched interval</text>
  <path d="M590 310H1050M590 310V323M1050 310V323" fill="none" stroke="#a6b1ce" stroke-width="1.5"/>

  <!-- Departure and no-branch callout. -->
  <text x="1192" y="269" fill="#ff5ee7" font-family="Segoe UI, Arial, sans-serif" font-size="22">departure</text>
  <text x="1173" y="300" fill="#ff5ee7" font-family="Segoe UI, Arial, sans-serif" font-size="22">from future</text>
  <path d="M1240 316V367" fill="none" stroke="#ff5ee7" stroke-width="1.8"/>
  <circle cx="1240" cy="367" r="4" fill="#ff5ee7"/>

  <rect x="1322" y="222" width="238" height="76" rx="13" fill="#090a18" fill-opacity="0.96" stroke="#ff5ee7" stroke-width="1.8"/>
  <circle cx="1352" cy="260" r="13" fill="#07152a" stroke="#c68cff" stroke-width="1.8"/>
  <circle cx="1352" cy="260" r="3.5" fill="#ff5ee7"/>
  <text x="1382" y="254" fill="#ff79e8" font-family="Segoe UI, Arial, sans-serif" font-size="17">same primary timeline</text>
  <text x="1382" y="280" fill="#ff79e8" font-family="Segoe UI, Arial, sans-serif" font-size="17">no branch created</text>
  <path d="M1442 299C1384 329 1316 362 1261 392" fill="none" stroke="#ff5ee7" stroke-width="1.7"/>

  <!-- Transit and frontal-time labels. -->
  <circle cx="596" cy="655" r="4" fill="#a78bff"/>
  <path d="M596 659V684" fill="none" stroke="#a78bff" stroke-width="1.6"/>
  <text x="596" y="710" fill="#a78bff" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle">isolated past-directed transit</text>

  <circle cx="886" cy="708" r="4" fill="#ff5d73"/>
  <path d="M890 708H918" fill="none" stroke="#ff5d73" stroke-width="1.6"/>
  <text x="930" y="715" fill="#ff5d73" font-family="Segoe UI, Arial, sans-serif" font-size="21">frontal time plane</text>

  <!-- Compact explanatory panel. -->
  <rect x="190" y="760" width="1220" height="92" rx="15" fill="#050a16" fill-opacity="0.96" stroke="#29354f"/>
  <g transform="translate(257 806)">
    <circle cx="0" cy="0" r="29" fill="none" stroke="#526885" stroke-width="1.8"/>
    <path d="M-23 4A24 24 0 0 1 15-19" fill="none" stroke="#14eaff" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M15-19l1 9 8-3" fill="none" stroke="#ff5ee7" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0-12V2L10 8" fill="none" stroke="#d7b0ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-24" cy="4" r="4.5" fill="#14eaff"/>
    <circle cx="23" cy="7" r="4.5" fill="#ff5ee7"/>
  </g>
  <line x1="317" y1="780" x2="317" y2="832" stroke="#34425d"/>
  <text x="350" y="798" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="18">The trip does not rewrite the timeline: its past intervention is already one of the causes of the future departure.</text>
  <text x="350" y="829" fill="#dfe8ff" font-family="Segoe UI, Arial, sans-serif" font-size="18">During transit the traveler is isolated; after reintegration, the same history carries the added state until departure closes the loop.</text>
</svg>
