<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Isometric History Bundle</title>
  <desc id="desc">A compressed shared historical strand moves through volumetric history-space and splits only at first required state distinctions. Distinguishable child strands then reach the current frontal-time frontier S(Fmax).</desc>
  <defs>
    <radialGradient id="bg" cx="52%" cy="48%" r="88%"><stop offset="0" stop-color="#07162d"/><stop offset="0.68" stop-color="#020713"/><stop offset="1" stop-color="#00030a"/></radialGradient>
    <linearGradient id="plane" x1="1160" y1="130" x2="1410" y2="760" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff6b7d" stop-opacity="0.05"/><stop offset="0.5" stop-color="#ff234a" stop-opacity="0.34"/><stop offset="1" stop-color="#ff6b7d" stop-opacity="0.10"/></linearGradient>
    <linearGradient id="shared" x1="240" y1="470" x2="720" y2="430" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#14eaff"/><stop offset="0.55" stop-color="#f8fbff"/><stop offset="1" stop-color="#b781ff"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#16426f" stroke-opacity="0.10"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="800" y="70" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="48" text-anchor="middle">Isometric History Bundle</text>
  <text x="800" y="108" fill="#9fb0cc" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle">still-equivalent continuations stay compressed; strands split only at first required state distinctions</text>

  <g stroke="#1f6fc7" fill="none" opacity="0.22">
    <path d="M160 270 L1160 120 L1410 260 L405 390 Z"/>
    <path d="M160 660 L1160 510 L1410 750 L405 820 Z"/>
    <path d="M160 270V660 M405 390V820 M1160 120V510 M1410 260V750"/>
    <path d="M160 390 L405 505 L1410 380 M160 510 L405 625 L1410 500 M160 600 L405 715 L1410 630"/>
  </g>

  <polygon points="1160,120 1410,260 1410,750 1160,510" fill="url(#plane)" stroke="#ff536d" stroke-width="4"/>
  <line x1="1410" y1="260" x2="1410" y2="750" stroke="#ff7182" stroke-width="5"/>
  <text x="1285" y="185" fill="#ff657a" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle">current frontier</text>
  <text x="1285" y="215" fill="#ff8b9a" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle">S(Fmax)</text>

  <path d="M230 470 C360 455 485 447 610 438 C665 434 705 431 740 430" fill="none" stroke="#7895d5" stroke-opacity="0.18" stroke-width="28" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M230 470 C360 455 485 447 610 438 C665 434 705 431 740 430" fill="none" stroke="url(#shared)" stroke-width="6" stroke-linecap="round"/>
  <text x="305" y="420" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="22">compressed history class</text>
  <text x="305" y="447" fill="#a8bbd8" font-family="Segoe UI, Arial, sans-serif" font-size="17">many admissible continuations, one current state</text>

  <path d="M500 446 C585 365 655 338 740 330" fill="none" stroke="#66d8ff" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="8 10"/>
  <path d="M520 443 C615 535 665 565 760 585" fill="none" stroke="#ff67d8" stroke-opacity="0.30" stroke-width="2.5" stroke-dasharray="8 10"/>
  <text x="590" y="322" fill="#6eaed0" font-family="Segoe UI, Arial, sans-serif" font-size="16">admissible continuation space</text>

  <g filter="url(#glow)">
    <circle cx="740" cy="430" r="19" fill="#07152a" stroke="#f8fbff" stroke-width="4"/>
    <circle cx="740" cy="430" r="9" fill="#07152a" stroke="#d3a1ff" stroke-width="3"/>
  </g>
  <text x="740" y="274" fill="#d7b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle">first required distinction</text>
  <text x="740" y="301" fill="#aab6d8" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle">Divergence Node</text>
  <path d="M740 314V401" stroke="#d7b0ff" stroke-width="1.8"/>

  <path d="M740 430 C835 350 940 300 1060 285 C1130 278 1195 295 1260 325" fill="none" stroke="#14eaff" stroke-width="5" stroke-linecap="round"/>
  <path d="M740 430 C850 422 960 420 1070 430 C1140 437 1200 445 1260 450" fill="none" stroke="#f8fbff" stroke-width="5" stroke-linecap="round"/>
  <path d="M740 430 C835 515 945 565 1060 585 C1130 598 1195 590 1260 565" fill="none" stroke="#ff67d8" stroke-width="5" stroke-linecap="round"/>
  <path d="M940 550 C1030 650 1120 680 1260 665" fill="none" stroke="#ffbd56" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#glow)"><circle cx="940" cy="550" r="12" fill="#07152a" stroke="#ffbd56" stroke-width="3"/></g>
  <text x="930" y="625" fill="#ffbd56" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle">later class split</text>

  <g fill="#07152a" stroke-width="3" filter="url(#glow)">
    <circle cx="230" cy="470" r="8" stroke="#14eaff"/><circle cx="420" cy="452" r="7" stroke="#6ed9ff"/><circle cx="610" cy="438" r="7" stroke="#d6eaff"/>
    <circle cx="860" cy="355" r="7" stroke="#14eaff"/><circle cx="1060" cy="285" r="7" stroke="#14eaff"/><circle cx="1260" cy="325" r="9" stroke="#14eaff"/>
    <circle cx="860" cy="424" r="7" stroke="#f8fbff"/><circle cx="1070" cy="430" r="7" stroke="#f8fbff"/><circle cx="1260" cy="450" r="9" stroke="#f8fbff"/>
    <circle cx="860" cy="520" r="7" stroke="#ff67d8"/><circle cx="1060" cy="585" r="7" stroke="#ff67d8"/><circle cx="1260" cy="565" r="9" stroke="#ff67d8"/>
    <circle cx="1080" cy="655" r="6" stroke="#ffbd56"/><circle cx="1260" cy="665" r="9" stroke="#ffbd56"/>
  </g>

  <text x="1010" y="225" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="19">distinguishable child strand</text>
  <text x="1015" y="412" fill="#e8edff" font-family="Segoe UI, Arial, sans-serif" font-size="19">distinguishable child strand</text>
  <text x="1015" y="610" fill="#ff8de3" font-family="Segoe UI, Arial, sans-serif" font-size="19">distinguishable child strand</text>

  <rect x="230" y="790" width="1080" height="70" rx="14" fill="#050a16" fill-opacity="0.95" stroke="#29354f"/>
  <text x="770" y="820" fill="#dfe8ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">A visible strand represents one current history equivalence class, not every complete future separately.</text>
  <text x="770" y="847" fill="#aab6d8" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle">Explicit branching appears only when global consistency requires different current physical or record states.</text>
</svg>
