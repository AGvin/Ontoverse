<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Замкнена часова петля та розділення класу історій</title>
  <desc id="desc">Стиснений спільний клас історій розділяється під час реінтеграції R на жилу без петлі та жилу, сумісну з петлею. Пізніше відправлення D замикає ізольований транзит у минуле й не створює нової гілки. Рубінова площина позначає ретроспективний опорний зріз S(Fref).</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="47%" r="86%"><stop offset="0" stop-color="#07152a"/><stop offset="0.68" stop-color="#020713"/><stop offset="1" stop-color="#00030a"/></radialGradient>
    <linearGradient id="shared" x1="120" y1="420" x2="390" y2="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#14eaff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
    <linearGradient id="loopHistory" x1="390" y1="420" x2="1235" y2="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#14eaff"/><stop offset="0.52" stop-color="#f8fbff"/><stop offset="1" stop-color="#ff5ee7"/></linearGradient>
    <linearGradient id="freeHistory" x1="390" y1="420" x2="1450" y2="315" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9bb7d8"/><stop offset="1" stop-color="#6f88ad"/></linearGradient>
    <linearGradient id="loop" x1="1260" y1="510" x2="365" y2="510" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff63e6"/><stop offset="0.5" stop-color="#a88cff"/><stop offset="1" stop-color="#18e4ff"/></linearGradient>
    <linearGradient id="enrichment" x1="390" y1="420" x2="1235" y2="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#28dfff" stop-opacity="0.32"/><stop offset="0.5" stop-color="#f8fbff" stop-opacity="0.58"/><stop offset="1" stop-color="#ff62e5" stop-opacity="0.38"/></linearGradient>
    <linearGradient id="plane" x1="790" y1="220" x2="858" y2="710" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff697c" stop-opacity="0.06"/><stop offset="0.48" stop-color="#b31235" stop-opacity="0.24"/><stop offset="1" stop-color="#ff697c" stop-opacity="0.08"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#16426f" stroke-opacity="0.10"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <text x="800" y="66" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="46" text-anchor="middle">Замкнена часова петля та розділення класу</text>
  <text x="800" y="101" fill="#9fb0cc" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle">реінтеграція створює першу необхідну відмінність; пізніше відправлення замикає петлю</text>
  <rect x="260" y="125" width="1080" height="82" rx="14" fill="#050a16" fill-opacity="0.94" stroke="#264c7a"/>
  <text x="420" y="157" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle">спільний клас історій</text><text x="590" y="157" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle">-&gt;</text><text x="785" y="157" fill="#d7b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle">розділення в R</text><text x="910" y="157" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle">-&gt;</text><text x="1120" y="157" fill="#ff79e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle">D замикає петлю; нової гілки немає</text>
  <text x="800" y="187" fill="#aab6d8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">ретроспективна причинна структура · рубінова площина = S(Fref), не поточний S(Fmax)</text>
  <path d="M120 420H390" fill="none" stroke="#7492bd" stroke-opacity="0.18" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/><path d="M120 420H390" fill="none" stroke="url(#shared)" stroke-width="5.5" stroke-linecap="round"/><text x="115" y="392" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="20">стиснений спільний клас</text>
  <path d="M390 420 C570 390 735 355 905 332 C1090 306 1265 305 1450 315" fill="none" stroke="url(#freeHistory)" stroke-width="4.5" stroke-linecap="round"/><text x="960" y="292" fill="#8fa9c9" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle">дочірня жила без петлі</text>
  <path d="M390 420H1235" fill="none" stroke="url(#enrichment)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/><path d="M390 420H1450" fill="none" stroke="url(#loopHistory)" stroke-width="5.5" stroke-linecap="round"/><path d="M1450 420l-18-11M1450 420l-18 11" fill="none" stroke="#ff5ee7" stroke-width="3.8" stroke-linecap="round"/><text x="1090" y="455" fill="#dfe8ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle">дочірня жила, сумісна з петлею</text>
  <path d="M1235 420 L1288 420 C1365 430 1405 472 1409 518 C1418 625 1150 659 815 659 C476 659 228 627 244 520 C251 472 292 439 344 426 L390 420" fill="none" stroke="url(#loop)" stroke-width="10" stroke-opacity="0.11" filter="url(#glow)"/><path d="M1235 420 L1288 420 C1365 430 1405 472 1409 518 C1418 625 1150 659 815 659 C476 659 228 627 244 520 C251 472 292 439 344 426 L390 420" fill="none" stroke="url(#loop)" stroke-width="5" stroke-dasharray="13 12" stroke-linecap="butt" stroke-linejoin="round"/><text x="810" y="626" fill="#a78bff" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle">ізольований транзит у минуле</text>
  <polygon points="790,248 858,209 858,712 790,673" fill="url(#plane)" stroke="#ff526b" stroke-width="2.8"/><line x1="858" y1="209" x2="858" y2="712" stroke="#ff687b" stroke-width="4.2"/><text x="884" y="690" fill="#ff5d73" font-family="Segoe UI, Arial, sans-serif" font-size="18">опорний зріз S(Fref)</text><text x="884" y="714" fill="#ff8b9a" font-family="Segoe UI, Arial, sans-serif" font-size="15">ретроспективний · не S(Fmax)</text>
  <g filter="url(#glow)"><circle cx="390" cy="420" r="20" fill="#07152a" stroke="#f8fbff" stroke-width="4"/><circle cx="390" cy="420" r="10" fill="#07152a" stroke="#14eaff" stroke-width="3.5"/></g><text x="390" y="250" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle">R · реінтеграція</text><text x="390" y="278" fill="#d7b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">перша необхідна відмінність</text><text x="390" y="302" fill="#aab6d8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">вузол розгалуження в мінімальному випадку</text><path d="M390 316V390" fill="none" stroke="#8bdfff" stroke-width="1.8"/>
  <g filter="url(#glow)"><circle cx="1235" cy="420" r="20" fill="#07152a" stroke="#f8fbff" stroke-width="4"/><circle cx="1235" cy="420" r="10" fill="#07152a" stroke="#ff5ee7" stroke-width="3.5"/></g><text x="1235" y="250" fill="#ff5ee7" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle">D · відправлення</text><text x="1235" y="278" fill="#ff8de8" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">замикає наявну петлю</text><text x="1235" y="302" fill="#aab6d8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">не є вузлом розгалуження</text><path d="M1235 316V390" fill="none" stroke="#ff5ee7" stroke-width="1.8"/>
  <path d="M410 356H1215M410 356V373M1215 356V373" fill="none" stroke="#a6b1ce" stroke-width="1.5"/><text x="812" y="346" fill="#c1c3f2" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle">параметрично збагачений інтервал у жилі з петлею</text>
  <rect x="70" y="505" width="390" height="112" rx="13" fill="#07101f" fill-opacity="0.95" stroke="#3b668d"/><text x="94" y="535" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="16">У R дві дочірні історії відрізняються:</text><text x="94" y="563" fill="#14eaff" font-family="Segoe UI, Arial, sans-serif" font-size="15">з петлею = мандрівник + перенесений стан</text><text x="94" y="589" fill="#9bb7d8" font-family="Segoe UI, Arial, sans-serif" font-size="15">без петлі = поверненого мандрівника немає</text>
  <rect x="145" y="754" width="1310" height="112" rx="15" fill="#050a16" fill-opacity="0.96" stroke="#29354f"/><text x="800" y="786" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" text-anchor="middle">Майбутнє відправлення не переписує минуле й не створює гілку в D.</text><text x="800" y="817" fill="#dfe8ff" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" text-anchor="middle">Самоузгодженість вимагає окремої історії з петлею вже від її першого відмінного стану — R у цьому випадку.</text><text x="800" y="848" fill="#aab6d8" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" text-anchor="middle">Пам’ять, записи й фізичний стан із пізнішої історії вже є частиною цієї відмінності.</text>
</svg>
