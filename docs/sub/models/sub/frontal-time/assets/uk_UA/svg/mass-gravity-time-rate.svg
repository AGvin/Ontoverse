<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Маса-енергія, щільність причинної обробки, частота переходів і гравітація</title><desc id="desc">Показує спекулятивний ланцюг Ontoverse від концентрації маси-енергії до більшого навантаження причинної обробки, нижчої частоти значущих переходів і темпоральної щільності, градієнта локального темпу часу та гравітаційного впливу на траєкторії.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#020713"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ffcff"/><stop offset="1" stop-color="#1d91ff"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff3a8"/><stop offset="1" stop-color="#ffc933"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#7af7ff"/></marker><marker id="arrG" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#ffd864"/></marker><style><![CDATA[.title{font:800 30px Arial,sans-serif;fill:#fff}.subtitle{font:15px Arial,sans-serif;fill:#bfefff}.panel{fill:rgba(2,10,25,.78);stroke:#37d8ff;stroke-width:2;rx:18;filter:url(#glow)}.box{fill:rgba(0,12,28,.75);stroke:#78f7ff;stroke-width:1.5;rx:12}.h{font:700 20px Arial,sans-serif;fill:#fff}.t{font:15px Arial,sans-serif;fill:#dffcff}.small{font:13px Arial,sans-serif;fill:#bfefff}.cyan{fill:#7af7ff}.gold{fill:#ffd864}.grid{fill:none;stroke:#2d7fff;stroke-width:1;opacity:.6}]]></style></defs>
  <rect width="1200" height="520" fill="url(#bg)"/><text x="48" y="52" class="title">Навантаження обробки, переходи та гравітація</text><text x="48" y="78" class="subtitle">Щільність причинної обробки відрізняється від темпоральної; запропонований зв’язок залишається спекулятивним.</text>
  <rect x="48" y="110" width="410" height="350" class="panel"/><text x="76" y="148" class="h">Інтерпретаційний ланцюг</text><g transform="translate(82 174)"><rect x="0" y="0" width="340" height="34" class="box"/><text x="170" y="23" class="t" text-anchor="middle">концентрація маси-енергії</text><rect x="0" y="50" width="340" height="34" class="box"/><text x="170" y="73" class="t" text-anchor="middle">щільність причинної обробки зростає</text><rect x="0" y="100" width="340" height="34" class="box"/><text x="170" y="123" class="t" text-anchor="middle">ефективна частота переходів зменшується</text><rect x="0" y="150" width="340" height="44" class="box"/><text x="170" y="168" class="small" text-anchor="middle">темпоральна щільність зменшується</text><text x="170" y="187" class="small" text-anchor="middle">локальний час накопичується повільніше</text><rect x="0" y="210" width="340" height="34" class="box"/><text x="170" y="233" class="t" text-anchor="middle">градієнт локального темпу часу</text><rect x="0" y="260" width="340" height="38" rx="12" fill="rgba(45,32,0,.72)" stroke="#ffd864" stroke-width="1.5"/><text x="170" y="286" class="t gold" text-anchor="middle">гравітаційний ефект на траєкторію</text><g stroke="#78f7ff" stroke-width="2.5" marker-end="url(#arr)"><line x1="170" y1="34" x2="170" y2="48"/><line x1="170" y1="84" x2="170" y2="98"/><line x1="170" y1="134" x2="170" y2="148"/><line x1="170" y1="194" x2="170" y2="208"/><line x1="170" y1="244" x2="170" y2="258"/></g></g>
  <rect x="520" y="110" width="632" height="350" class="panel"/><text x="548" y="148" class="h">Локальна для жили польова інтерпретація</text><g transform="translate(575 190)"><path d="M0 135 C95 82 188 188 280 130 S430 80 530 130" fill="none" stroke="url(#cyan)" stroke-width="3"/><path d="M0 168 C95 118 188 222 280 165 S430 118 530 168" class="grid"/><ellipse cx="265" cy="135" rx="180" ry="60" fill="none" stroke="#2d7fff" opacity=".55"/><ellipse cx="265" cy="135" rx="105" ry="35" fill="none" stroke="#78f7ff" opacity=".7"/><circle cx="265" cy="135" r="24" fill="#ffd864" filter="url(#glow)"/><path d="M40 105 C120 40 190 180 265 135 C350 84 420 74 505 105" fill="none" stroke="url(#gold)" stroke-width="5" marker-end="url(#arrG)" filter="url(#glow)"/><path d="M40 165 C130 220 190 98 265 135 C348 174 430 214 510 166" fill="none" stroke="url(#cyan)" stroke-width="5" marker-end="url(#arr)" filter="url(#glow)"/><text x="265" y="245" class="small" text-anchor="middle">та сама жила, нерівномірне локальне поле темпу часу</text></g><g transform="translate(880 170)"><rect x="0" y="0" width="220" height="74" rx="12" fill="rgba(0,18,35,.72)" stroke="#78f7ff"/><text x="110" y="22" class="small" text-anchor="middle">навантаження обробки ≠</text><text x="110" y="42" class="small" text-anchor="middle">темпоральна щільність</text><text x="110" y="62" class="small" text-anchor="middle">зв’язок — гіпотеза</text><rect x="0" y="102" width="220" height="70" rx="12" fill="rgba(45,32,0,.68)" stroke="#ffd864"/><text x="110" y="129" class="small" text-anchor="middle">градієнти темпу часу</text><text x="110" y="151" class="small" text-anchor="middle">змінюють можливі шляхи</text></g>
  <rect x="245" y="478" width="710" height="28" rx="10" fill="rgba(0,16,30,.85)" stroke="#37d8ff"/><text x="600" y="498" class="t" text-anchor="middle">більше навантаження → нижча частота переходів → повільніший локальний час відносно F</text>
</svg>
